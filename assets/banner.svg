<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <clipPath id="c1"><rect class="r r1" x="60" y="0" width="0" height="300"/></clipPath>
    <clipPath id="c2"><rect class="r r2" x="60" y="0" width="0" height="300"/></clipPath>
    <clipPath id="c3"><rect class="r r3" x="60" y="0" width="0" height="300"/></clipPath>
    <clipPath id="c4"><rect class="r r4" x="60" y="0" width="0" height="300"/></clipPath>
    <style>
      text { font-family: 'Courier New', monospace; }
      .t { font-size: 17px; }
      .p { fill: #00d8ff; }
      .k { fill: #8be9a8; }
      .v { fill: #ffffff; }
      .r { animation: type 12s steps(34) infinite; }
      .r1 { animation-delay: 0.3s; }
      .r2 { animation-delay: 1.8s; }
      .r3 { animation-delay: 3.3s; }
      .r4 { animation-delay: 4.8s; }
      @keyframes type {
        0%   { width: 0; }
        12%  { width: 460px; }
        88%  { width: 460px; }
        100% { width: 0; }
      }
      .cursor { animation: blink 1s steps(1) infinite; fill: #00d8ff; }
      @keyframes blink { 50% { opacity: 0; } }
      .orb { animation: float 4s ease-in-out infinite; }
      .o2 { animation-delay: -1s; } .o3 { animation-delay: -2s; }
      .o4 { animation-delay: -3s; } .o5 { animation-delay: -1.5s; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      .ol { font-size: 15px; font-weight: bold; fill: #fff; text-anchor: middle; }
      .ring { animation: spin 20s linear infinite; transform-origin: 740px 150px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .glow { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: .6; } }
    </style>
  </defs>

  <rect width="900" height="300" rx="18" fill="url(#bg)"/>

  <!-- terminal window -->
  <rect x="30" y="35" width="510" height="230" rx="12" fill="#0b1418" opacity="0.9"/>
  <circle cx="55" cy="58" r="6" fill="#ff5f56"/>
  <circle cx="76" cy="58" r="6" fill="#ffbd2e"/>
  <circle cx="97" cy="58" r="6" fill="#27c93f"/>
  <text x="290" y="63" font-size="13" fill="#6b8791" text-anchor="middle">abishek@dev: ~</text>

  <g class="t">
    <g clip-path="url(#c1)"><text x="60" y="110" class="t"><tspan class="p">$ </tspan><tspan class="k">name</tspan><tspan class="v">  → Abishek Varshan</tspan></text></g>
    <g clip-path="url(#c2)"><text x="60" y="150" class="t"><tspan class="p">$ </tspan><tspan class="k">role</tspan><tspan class="v">  → Software Engineer</tspan></text></g>
    <g clip-path="url(#c3)"><text x="60" y="190" class="t"><tspan class="p">$ </tspan><tspan class="k">now</tspan><tspan class="v">   → Learning Java</tspan></text></g>
    <g clip-path="url(#c4)"><text x="60" y="230" class="t"><tspan class="p">$ </tspan><tspan class="k">cloud</tspan><tspan class="v"> → AWS · Docker · K8s · Linux</tspan></text></g>
  </g>
  <rect class="cursor" x="520" y="214" width="10" height="20"/>

  <!-- rotating ring + glow -->
  <circle class="glow" cx="740" cy="150" r="115" fill="#00d8ff" opacity=".25"/>
  <g class="ring">
    <circle cx="740" cy="150" r="110" fill="none" stroke="#00d8ff" stroke-width="1.5" stroke-dasharray="6 10" opacity=".7"/>
  </g>

  <!-- floating tech orbs -->
  <g class="orb">
    <circle cx="740" cy="150" r="38" fill="#ED8B00"/><text x="740" y="156" class="ol">Java</text>
  </g>
  <g class="orb o2">
    <circle cx="660" cy="85" r="28" fill="#6DB33F"/><text x="660" y="90" class="ol" style="font-size:12px">Spring</text>
  </g>
  <g class="orb o3">
    <circle cx="820" cy="85" r="28" fill="#F7DF1E"/><text x="820" y="91" class="ol" style="fill:#000">JS</text>
  </g>
  <g class="orb o4">
    <circle cx="660" cy="215" r="28" fill="#2496ED"/><text x="660" y="220" class="ol" style="font-size:12px">Docker</text>
  </g>
  <g class="orb o5">
    <circle cx="820" cy="215" r="28" fill="#326CE5"/><text x="820" y="221" class="ol">K8s</text>
  </g>
  <g class="orb o3">
    <circle cx="740" cy="256" r="22" fill="#FF9900"/><text x="740" y="261" class="ol" style="font-size:12px;fill:#000">AWS</text>
  </g>
  <g class="orb o2">
    <circle cx="740" cy="42" r="22" fill="#FCC624"/><text x="740" y="47" class="ol" style="font-size:11px;fill:#000">Linux</text>
  </g>
</svg>
